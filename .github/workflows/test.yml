name: Test formula

on:
  push:
    paths: ['Formula/**', 'scripts/**', '.github/workflows/**']
  pull_request:
    paths: ['Formula/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - name: Install and test
        run: |
          brew install zanza00/tap/source-fetch
          brew test zanza00/tap/source-fetch
