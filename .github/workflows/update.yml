name: Update source-fetch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-source-fetch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Generate formula from the latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-source-fetch.py
      - name: Validate formula syntax
        run: ruby -c Formula/source-fetch.rb
      - name: Commit formula update
        run: |
          if git diff --quiet -- Formula/source-fetch.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/source-fetch.rb
          git commit -m 'chore: update source-fetch formula'
          git push origin HEAD:main
